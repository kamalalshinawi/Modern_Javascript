<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        border: 2px solid #333;
        margin: 20px;
        padding: 20px;
      }
      .form-container {
        background-color: #f5f5f5;
        margin: 20px;
        padding: 20px;
      }
      .item {
        padding: 10px;
        margin: 5px;
        background-color: #f0f0f0;
        border: 1px solid #999;
      }
      .delete-btn {
        padding: 0 5px;
        cursor: pointer;
        color: red;
        float: right;
      }
      .custom-menu {
        display: none;
        position: absolute;
        background: white;
        border: 1px solid #999;
        padding: 10px;
      }
      .modal {
        border: 2px solid #f0f0f0;
        background: white;
        padding: 10px;
        margin: 20px;
      }
      .Input-field {
        padding: 5px;
        margin: 10px 0;
      }
      .error {
        color: red;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container" id="mainContainer">
      <h2>Interactive Container</h2>
      <div class="item">Item1 <span class="delete-btn">x</span></div>
      <div class="item">Item 2 <span class="delete-btn">x</span></div>
    </div>

    <div class="form-container">
      <form id="myForm">
        <input
          type="text"
          placeholder="enter your name"
          id="nameInput"
          class="Input-field"
        />

        <div class="error" id="nameError">Name is Required</div>

        <input
          type="email"
          id="emailInput"
          class="Input-field"
          placeholder="Enter your Email"
        />

        <div class="error" id="emailError">Email is require</div>

        <button type="submit">Submit</button>
      </form>
    </div>

    <div class="modal" id="simpleModal">
      <h3>Modal content</h3>
      <p>click anywhere inside this modal.</p>
      <p>Events will not propagate to parent element.</p>
    </div>

    <div class="custom-menu" id="customMenu">
      <div>Custom Menu Item 1</div>
      <div>Custom Menu Item 2</div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
