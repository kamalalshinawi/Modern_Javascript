<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDo App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Todo List</h1>
      <div id="add-Task">
        <form action="GET">
          <input type="text" placeholder="Enter the New Task" />
          <button type="submit" id="submit-btn">Add Task</button>
        </form>
      </div>
      <div id="todoList"></div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
